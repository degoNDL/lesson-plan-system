name: Frontend CI

on:
  push:
    branches: [main, dev]

jobs:
  lint-and-typecheck:
    name: ESLint e TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: |
          if [ -f "package.json" ]; then
            npm ci
          else
            echo "⚠ package.json ainda não existe, pulando frontend CI."
            exit 0
          fi

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run type-check