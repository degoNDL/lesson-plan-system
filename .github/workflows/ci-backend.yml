name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  checkstyle:
    name: Lint e Formatação
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de lint
        run: pip install black ruff

      - name: Ruff - verificar lint
        run: ruff check .

      - name: Black - verificar formatação
        run: black --check .

  test-coverage:
    name: Testes e Cobertura (mín. 70%)
    runs-on: ubuntu-latest
    needs: checkstyle

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes com cobertura
        env:
          GROQ_API_KEY: "test-groq-api-key"
          DATABASE_URL: "sqlite:///./test.db"
          FLASK_ENV: "testing"
          SECRET_KEY: "test-secret-key"
        run: |
          if [ -d "tests" ] && [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            pytest --cov=app --cov-report=term-missing --cov-fail-under=70
          else
            echo "⚠️ Nenhum teste encontrado ainda, pulando cobertura."
          fi